<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <!-- GoogleFonts↓ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        /* outline: 1px dotted yellow; */
      }
      /* TEMP: universe placeholder styles (move to scss later) */

      body.universe {
        display: flex;
        flex-direction: column; /* 子要素を縦方向に並べる */
        height: 100%; /* 親要素の高さを100%にする */

        background: linear-gradient(
          to bottom,
          rgba(27, 38, 59, 1) 40%,
          rgba(15, 26, 43, 0) 100%
        );
        font-size: 24px;
        color: #f2f2f2;
        font-family: "Zen Kaku Gothic New", sans-serif;
        font-weight: 300;
        font-style: normal;
      }

      .header,
      .footer {
        /* ヘッダーとフッターはコンテンツのサイズに合わせて自動調整される */
        flex: 0 1 auto;
        /* padding: 10px; */
      }

      .page-main {
        flex: 1; /* 残りのスペースすべてを埋めるように伸縮する */
        overflow: auto; /* コンテンツが多すぎる場合にスクロール可能にする */
      }

      .page-main h3 {
        margin: 0 0 0.85rem;
      }

      .page-main p {
        margin: 0 0 1.15em;
        padding: 0 1.25rem;
        max-width: 52ch;
        font-size: clamp(1rem, 2vw, 1.25rem);
        text-wrap: pretty; /* 自然な改行 */
        text-shadow: 0 2px 2px rgb(27 38 59 / 1);
      }

      .page-links {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        font-size: clamp(1rem, 2vw, 1.25rem);
      }

      .page-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1rem;
        gap: 0.5rem;
        min-width: 10rem;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        box-shadow: none;
        color: inherit;
        box-shadow: 0 2px 10px rgb(27 38 59 / 0.3);
        text-decoration: none;
        /* 対象要素とその子孫要素の文章は範囲選択できません */
        user-select: none;
        transition: background-color 0.15s;
        cursor: pointer;
      }

      .page-links a:hover {
        background: color-mix(in oklch, transparent 90%, rgb(27 38 59 / 1) 10%);
      }

      .menu-drawer a {
        font-size: var(--fs);
      }

      .site-footer {
        margin: 0 auto;
        color: rgb(27 38 59 / 1);
      }

      .page--universe .page-header {
        color: color-mix(in oklch, transparent 10%, #f2f2f2 90%);
      }

      @media (width <= 480px) {
        body.universe {
          h3 {
            font-size: 1.25rem;
          }
          .page-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
          }

          .page-links a {
            padding: 0.5rem 1rem;
          }
        }
      }

      @media (height <= 480px) {
        body.universe {
          h3 {
            font-size: 1.25rem;
          }
          .page-links a {
            padding: 0.5rem 1rem;
          }
        }
      }
    </style>

    <script src="js/site-menu.js" defer></script>
    <title>遠くのことを少しだけ leaf.loop - portfolio</title>
  </head>
  <body class="universe booting page page--universe">
    <!-- /* ≡≡≡ メニューここから */ -->
    <!-- ページ共通のヘッダ -->
    <header class="page-header">
      <div class="page-header__bar">
        <!-- メニューアイコン -->
        <button
          class="page-header__toggle hamburger"
          aria-label="メニューを開く"
          aria-controls="site-menu"
          aria-expanded="false"
        >
          <!-- menu　ハンバーガーSVG -->
          <span aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
              aria-hidden="true"
              focusable="false"
              class="i i-44"
            >
              <path
                fill="currentColor"
                d="M120-240v-80h720v80zm0-200v-80h720v80zm0-200v-80h720v80z"
              />
            </svg>
          </span>
        </button>
        <div class="page-header__brand">
          <h1 class="page-header__title">leaf.loop - portfolio</h1>
          <h2 class="page-header__subtitle">遠くのことを少しだけ</h2>
        </div>
      </div>
    </header>

    <main class="page-main text" id="main">
      <h3 class="page-title">遠くのことを少しだけ</h3>

      <p class="page-lead">このページは、ただいま準備中です。</p>

      <p class="page-note">
        “宇宙のことば” を、静かに並べる場所になる予定です。
        もう少しだけ、お待ちください。
      </p>

      <nav class="page-links" aria-label="サイト内リンク">
        <a href="./gallery.html">世界のお茶を少しだけ</a>
        <a href="./about.html">このサイトについて</a>
      </nav>
    </main>

    <footer class="site-footer">
      <small>© leaf.loop</small>
    </footer>
    <!-- 背景クリック用 -->
    <div class="scrim dots" hidden></div>
    <!-- 右端で待機するメニュー-->
    <nav id="site-menu" class="menu-drawer" role="navigation" hidden>
      <div class="menu-drawer__wrapper">
        <div class="menu-drawer__head">
          <span class="menu-drawer__title">Menu</span>
          <!-- 閉じるボタンSVG -->
          <button class="menu-drawer__close" aria-label="メニューを閉じる">
            <!-- メニュー close × -->
            <svg
              class="i"
              viewBox="0 -960 960 960"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M480-424 284-228q-11 11-28 11t-28-11-11-28 11-28l196-196-196-196q-11-11-11-28t11-28 28-11 28 11l196 196 196-196q11-11 28-11t28 11 11 28-11 28L536-480l196 196q11 11 11 28t-11 28-28 11-28-11z"
              />
            </svg>
          </button>
        </div>

        <!-- メニューリスト -->
        <ul class="menu-drawer__list">
          <li class="menu-drawer__item">
            <a class="menu-drawer__link" href="./index.html">ホーム</a>
          </li>
          <li class="menu-drawer__item">
            <a class="menu-drawer__link" href="./gallery.html"
              >世界のお茶を少しだけ</a
            >
          </li>
          <li class="menu-drawer__item">
            <a
              class="menu-drawer__link"
              href="./universe.html"
              aria-current="page"
              >遠くのことを少しだけ（準備中）</a
            >
          </li>
          <li class="menu-drawer__item">
            <a class="menu-drawer__link" href="./about.html"
              >このサイトについて</a
            >
          </li>
        </ul>
      </div>
      <!-- 飾り時計🕰️ -->
      <div class="decor-clock">
        <svg
          class="decor-clock__svg"
          width="200"
          height="160"
          viewBox="0 0 200 160"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- 背景 -->
          <path
            class="decor-clock__bg decor-clock__bg--back"
            d="M0 69.248C0 12.2223 12.2223 0 69.248 0H102.181C159.206 0 171.428 12.2223 171.428 69.248V90.752C171.428 147.778 159.206 160 102.181 160H69.248C12.2223 160 0 147.778 0 90.752V69.248Z"
            fill="currentColor"
          />
          <!-- <g style="mix-blend-mode: multiply"> -->
          <path
            class="decor-clock__bg decor-clock__bg--mid"
            d="M28.5715 58.112C28.5715 22.4917 38.6169 14.8572 85.4858 14.8572H143.086C189.955 14.8572 200 22.4917 200 58.112V101.888C200 137.508 189.955 145.143 143.086 145.143H85.4858C38.6169 145.143 28.5715 137.508 28.5715 101.888V58.112Z"
            fill="currentColor"
          />
          <!-- </g> -->
          <!-- <g style="mix-blend-mode: multiply"> -->
          <path
            class="decor-clock__bg decor-clock__bg--front"
            d="M16 69.9338C16 36.8131 24.1033 29.7144 61.9108 29.7144H108.375C146.182 29.7144 154.286 36.8131 154.286 69.9338V110.638C154.286 143.758 146.182 150.857 108.375 150.857H61.9108C24.1033 150.857 16 143.758 16 110.638V69.9338Z"
            fill="currentColor"
          />
          <!-- </g> -->

          <!-- 針：中心(91.0348, 91.7905)にグループで移動 -->
          <g class="decor-clock__hands" transform="translate(91.0348 91.7905)">
            <!-- 時針 -->
            <!-- 元: M91.0348 91.7905 L124.658 111.203 -->
            <!-- 差分: (124.658 - 91.0348, 111.203 - 91.7905) = (33.6232, 19.4125) -->
            <path
              id="hour"
              class="hour-hand decor-clock__hand decor-clock__hand--h"
              d="M0 0 L0 -38.8"
              stroke="currentColor"
              stroke-width="0.5"
              stroke-linecap="round"
            />

            <!-- 分針 -->
            <!-- 元: M91.0344 91.7905 V34.3295 (= L91.0344 34.3295) -->
            <!-- 始点: (91.0344 - 91.0348, 91.7905 - 91.7905) = (-0.0004, 0) -->
            <!-- 終点: (91.0344 - 91.0348, 34.3295 - 91.7905) = (-0.0004, -57.461) -->
            <path
              id="minute"
              class="minute-hand decor-clock__hand decor-clock__hand--m"
              d="M-0.0004 0 L-0.0004 -57.461"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />

            <!-- 秒針 -->
            <!-- 元: M91.0343 91.7905 L137.624 91.7905 -->
            <!-- 始点: (91.0343 - 91.0348, 91.7905 - 91.7905) = (-0.0005, 0) -->
            <!-- 終点: (137.624 - 91.0348, 91.7905 - 91.7905) = (46.5892, 0) -->
            <path
              id="second"
              class="second-hand decor-clock__hand decor-clock__hand--s"
              d="M-0.0005 0 L46.5892 0"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />

            <!-- 中心の丸（お好みで） -->
            <circle
              class="decor-clock__center"
              cx="0"
              cy="0"
              r="2.5"
              fill="currentColor"
            />
          </g>
        </svg>
      </div>
    </nav>
  </body>
</html>
