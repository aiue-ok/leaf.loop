    <!-- /* ≡≡≡ ミニタイマーここから */ -->
    <aside class="timer-mini" aria-label="ティータイマー">
      <!-- カードの背景 -->
      <div class="timer-mini__bg">
        <div class="timer-mini__grid">
          <!-- 残り時間数の表示画面：ヘルプ＋残り時間 -->
          <div class="timer-mini__screen" aria-live="polite">
            <div class="timer-mini__screen--grid">
              <!-- gridアイテム①：残り時間 -->
              <div class="timer-mini__screen--display">
                <span
                  id="timer"
                  class="timer-mini__screen--count timer-mini__screen--tnum"
                  role="timer"
                  aria-label="お茶のタイマー 残り時間"
                  >00:00</span
                >
                <!-- 読み上げ専用（視覚には非表示） -->
                <div
                  id="timerLive"
                  class="sr-only"
                  aria-live="polite"
                  aria-atomic="true"
                ></div>
              </div>
              <!-- gridアイテム②：ヘルプ -->
              <!-- aria-controlsは制御対象となる要素のid -->
              <button
                class="timer-mini__icon-btn timer-mini__screen--help"
                id="helpBtn"
                aria-expanded="false"
                aria-controls="helpCard"
                type="button"
                aria-label="タイマーの使い方を開く"
              >
                <svg
                  class="i i-32"
                  viewBox="0 -960 960 960"
                  aria-hidden="true"
                  focusable="false"
                >

                    fill="currentColor"

                  />
                </svg>
              </button>
            </div>
          </div>
          <!-- プリセット（3・4・5分） -->
          <div
            class="timer-mini__presets timer-mini__grid--vertical"
            role="group"
            aria-label="時間をセットする"
          >
            <button
              type="button"
              class="timer-mini__pill timer__preset-btn"
              data-minutes="3"
              aria-label="3分に設定"
            >
              3
            </button>
            <button
              type="button"
              class="timer-mini__pill timer__preset-btn"
              data-minutes="4"
              aria-label="4分に設定"
            >
              4
            </button>
            <button
              type="button"
              class="timer-mini__pill timer__preset-btn"
              data-minutes="5"
              aria-label="5分に設定"
            >
              5
            </button>
          </div>
          <!-- コントロール（リフレッシュ／再生停止／サウンド） -->
          <div
            class="timer-mini__actions timer-mini__grid--vertical"
            role="group"
            id="timerPanel"
            aria-label="タイマー操作"
          >
            <button
              type="button"
              id="resetBtn"
              class="timer-mini__icon-btn timer-mini__icon-btn--refresh"
              data-action="reset"
              aria-label="タイマーをリセット"
            >
              <!-- refresh SVG -->
              <svg
                class="i"
                viewBox="0 -960 960 960"
                aria-hidden="true"
                focusable="false"
              >
                <path

                  d="M480-160q-134 0-227-93t-93-227 93-227 227-93q69 0 132 28.5T720-690v-70q0-17 11.5-28.5T760-800t28.5 11.5T800-760v200q0 17-11.5 28.5T760-520H560q-17 0-28.5-11.5T520-560t11.5-28.5T560-600h128q-32-56-87.5-88T480-720q-100 0-170 70t-70 170 70 170 170 70q68 0 124.5-34.5T692-367q8-14 22.5-19.5t29.5-.5q16 5 23 21t-1 30q-41 80-117 128t-169 48"
                />

            <button
              type="button"
              id="toggleTimer"
              aria-pressed="false"
              class="timer-mini__icon-btn timer__action-play"
              data-action="toggle-play"
              aria-label="タイマーを再生"
            >
              <!-- play / pause SVG をJSで差し替え -->

              <!-- 6 play▶️ -->

                  aria-hidden="true"

                  />
                </svg>
              </span>
              <!-- 7 stop🔲 -->
              <span id="stopBtn" class="timer__action-btn--paused is-active">
                <svg
                  class="i"
                  viewBox="0 -960 960 960"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    fill="currentColor"
                    d="M360-320h240q17 0 28.5-11.5T640-360v-240q0-17-11.5-28.5T600-640H360q-17 0-28.5 11.5T320-600v240q0 17 11.5 28.5T360-320M480-80q-83 0-156-31.5T197-197t-85.5-127T80-480t31.5-156T197-763t127-85.5T480-880t156 31.5T763-763t85.5 127T880-480t-31.5 156T763-197t-127 85.5T480-80m0-80q134 0 227-93t93-227-93-227-227-93-227 93-93 227 93 227 227 93m0-320"
                  />
                </svg>
              </span>
            </button>
            <button
              type="button"
              id="muteBtn"
              class="timer-mini__icon-btn timer-mini__icon-btn--sound"
              data-action="toggle-sound"
              aria-label="サウンドのオン・オフを切り替え"
              aria-pressed="false"
            >
              <!-- sound on/off SVG -->

              <!-- 2 ON=波線あり-->
              <span class="timer__action-btn--alarm-on timer__action-btn">
                <svg

                <svg

                  viewBox="0 -960 960 960"
                  aria-hidden="true"

                  />

              </span>
            </button>
          </div>
        </div>
      </div>
