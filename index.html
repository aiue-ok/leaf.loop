      <!-- loop：動画を繰り返し再生 -->
      <!-- playsinline:iOSで全画面化を防ぐ -->
      <!-- 画面揺れ防止に width/height を与えてCLS低減 -->
      <video
        id="background-video"
        class="hero__media-video"
        width="960"
        height="540"
        autoplay
        muted
        loop
        playsinline
        preload="none"
        poster="assets/jpg/hero-bg.jpg"

        <source
          src="assets/mp4/5835661-hd_1920_1080_25fps.mp4"
          type="video/mp4"
          media="(min-width: 1024px)"

        <source

          type="video/mp4"
        />

                      class="sr-only"
                      aria-live="polite"
                      aria-atomic="true"
